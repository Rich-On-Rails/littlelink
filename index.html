<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-light" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Rich On Rails</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Tracking code -->
    <script defer src="https://stats.richonrails.me/script.js" data-website-id="3a33b913-72d7-471e-a571-f2193e167611"></script>

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Rich On Rails, just a regular train nerd.">

    <!-- Keywords -->
    <meta name="keywords" content="rich on rails, youtube, train, steam, locomotives">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://richonrails.me">

    <!-- Author Information -->
    <meta name="author" content="Rich On Rails">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink">

            <!-- Replace with your name or brand -->
            <h1>
              <div>Rich On Rails</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Just a regular train nerd.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Generic Website -->
              <a class="button button-default" href="https://richonrails.co.uk" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">My Website</a>

              <!-- My Photos -->
              <a class="button button-my-photos" href="https://richonrails.photos" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-camera.png" alt="My Photos icon">View My Photos</a>

              <!-- Patreon -->
              <a class="button button-patreon" href="https://www.patreon.com/RichOnRails" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/patreon.svg" alt="Patreon Logo">Become a member</a>

              <!-- YouTube Alt -->
              <a class="button button-yt-alt" href="https://www.youtube.com/@rich_on_rails" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/youtube-alt.svg" alt="YouTube Logo">YouTube</a>

              <!-- TikTok -->
              <a class="button button-tiktok" href="https://www.tiktok.com/@richonrails" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

              <!-- Facebook -->
              <a class="button button-faceb" href="https://www.facebook.com/richonrailsblog" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo">Find me on Facebook</a>

              <!-- Bluesky -->
              <a class="button button-bluesky" href="https://bsky.app/profile/richonrails.me" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/bluesky.svg" alt="Bluesky Logo">Bluesky</a>

              <!-- Mastodon -->
              <a class="button button-mastodon" href="https://richonrails.social/@rich" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/mastodon.svg" alt="Mastodon Logo">Mastodon</a>

              <!-- X -->
              <a class="button button-x" href="https://x.com/rich_on_rails" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="X Logo">Follow on X</a>

              <!-- Threads -->
              <a class="button button-threads" href="https://www.threads.com/@richonrails" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/threads.svg" alt="Threads Logo">Threads</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/richonrails" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>              
      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="https://richonrails.co.uk" target="_blank" rel="noopener">Rich On Rails</a>
      </footer>

    </div>
  </div>

</body>

</html>
